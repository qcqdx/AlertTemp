name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check app tests migrations
      - name: Tests
        run: pytest -q

  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: timescale/timescaledb:latest-pg16
        env:
          POSTGRES_USER: coldwatch
          POSTGRES_PASSWORD: coldwatch
          POSTGRES_DB: coldwatch
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U coldwatch"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: pip install -e .
      - name: Apply migrations to TimescaleDB
        run: alembic upgrade head
        env:
          COLDWATCH_DATABASE_URL: postgresql+asyncpg://coldwatch:coldwatch@localhost:5432/coldwatch
      - name: Verify hypertable
        run: |
          python - <<'EOF'
          import asyncio
          from sqlalchemy import text
          from sqlalchemy.ext.asyncio import create_async_engine

          async def main():
              engine = create_async_engine(
                  "postgresql+asyncpg://coldwatch:coldwatch@localhost:5432/coldwatch"
              )
              async with engine.connect() as conn:
                  result = await conn.execute(text(
                      "SELECT count(*) FROM timescaledb_information.hypertables "
                      "WHERE hypertable_name = 'measurement'"
                  ))
                  assert result.scalar() == 1, "measurement is not a hypertable"
              await engine.dispose()
              print("hypertable ok")

          asyncio.run(main())
          EOF
