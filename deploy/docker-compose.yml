name: coldwatch

services:
  db:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: coldwatch
      POSTGRES_PASSWORD: ${COLDWATCH_DB_PASSWORD:?set in .env}
      POSTGRES_DB: coldwatch
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coldwatch"]
      interval: 5s
      timeout: 3s
      retries: 12

  # Локальный брокер. Если контроллеры шлют данные во внешний брокер
  # (например, 10.10.0.3), удалите этот сервис и укажите его адрес
  # в COLDWATCH_MQTT_HOST в .env.
  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mqtt-data:/mosquitto/data

  app:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # ВСЕ переменные COLDWATCH_* из .env доходят до приложения целиком —
    # явный список был источником P4 (настройка есть в config.py, но не
    # проброшена в контейнер). environment ниже — только вычисляемые значения
    # и дефолты; они имеют приоритет над env_file.
    env_file:
      - .env
    environment:
      COLDWATCH_DATABASE_URL: postgresql+asyncpg://coldwatch:${COLDWATCH_DB_PASSWORD}@db:5432/coldwatch
      COLDWATCH_MQTT_HOST: ${COLDWATCH_MQTT_HOST:-mqtt}
    ports:
      # API доступен только с хоста: наружу — через reverse-proxy с TLS
      # (профиль tls ниже). Прямой публичный проброс 8000 не делать.
      - "127.0.0.1:8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')\""]
      interval: 30s
      timeout: 5s
      retries: 3

  # TLS-терминатор (этап C). Включается профилем:
  #   docker compose --profile tls up -d
  # Требует в .env: COLDWATCH_PUBLIC_HOST (домен или хост) и
  # COLDWATCH_SESSION_COOKIE_SECURE=true (иначе cookie сессии уйдёт и по
  # HTTP — при работе за TLS это лишний риск).
  caddy:
    image: caddy:2
    restart: unless-stopped
    profiles: ["tls"]
    depends_on:
      - app
    environment:
      COLDWATCH_PUBLIC_HOST: ${COLDWATCH_PUBLIC_HOST:?set in .env for tls profile}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  db-data:
  mqtt-data:
  caddy-data:
  caddy-config:
